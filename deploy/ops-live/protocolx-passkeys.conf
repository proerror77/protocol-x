server {
    listen 80;
    server_name protocolx.mandonothing.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/golf-pilot-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://protocolx.mandonothing.com$request_uri;
    }
}

server {
    listen 9443 ssl;
    server_name protocolx.mandonothing.com;
    ssl_certificate /etc/letsencrypt/live/protocolx.mandonothing.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/protocolx.mandonothing.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/protocolx-passkeys;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/golf-pilot-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    # Keep /.well-known/assetlinks.json and /activate bypassed from Cloudflare Bot Fight Mode / WAF challenges
    # so Android App Links and Credential Manager verification can fetch them directly.
    location = /.well-known/assetlinks.json {
        default_type application/json;
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    location = /activate {
        default_type text/html;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files /activate.html =404;
    }

    location / {
        return 404;
    }
}
