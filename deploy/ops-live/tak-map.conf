map $http_upgrade $golf_tak_connection {
    default upgrade;
    '' close;
}

server {
    listen 127.0.0.1:8180;
    server_name 127.0.0.1;
    root /var/www/html/opentakserver;
    index index.html;
    add_header Content-Security-Policy "frame-ancestors 'self' http://127.0.0.1:18080" always;

    if ($host != 127.0.0.1) { return 421; }

    include /opt/golf-tak-admin/assets.conf;

    location = /ops-map/embed.js {
        alias /opt/golf-ops-live/embed.js;
        default_type application/javascript;
    }

    location = /ops-map/embed.css {
        alias /opt/golf-ops-live/embed.css;
        default_type text/css;
    }

    location = /ops-map/task-links.js {
        alias /opt/golf-ops-live/task-links.js;
        default_type application/javascript;
    }

    location = /index.html {
        sub_filter '</head>' '<link rel="stylesheet" href="/ops-map/embed.css?v=tasks-1"><link rel="stylesheet" href="/golf-tak-admin/admin.css"><link rel="stylesheet" href="/golf-tak-admin/aircraft.css?v=weather-1"><script defer src="/ops-map/embed.js"></script><script defer data-database-offset-minutes="480" src="/ops-map/task-links.js?v=tasks-4"></script><script defer src="/golf-tak-admin/admin.js"></script><script defer src="/golf-tak-admin/weather.js"></script><link rel="stylesheet" href="/golf-tak-admin/map-workbench.css"><script defer src="/golf-tak-admin/map-workbench.js"></script><script defer src="/golf-tak-admin/aircraft.js?v=weather-1"></script></head>';
        sub_filter_once on;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "frame-ancestors 'self' http://127.0.0.1:18080" always;
    }

    # OTS UI's initial viewport is hard-coded. Scope the Hong Kong default to this private listener.
    location ~ ^/assets/js/Map-[A-Za-z0-9_-]+\.js$ {
        try_files $uri =404;
        sub_filter_types application/javascript text/javascript;
        sub_filter 'center:[10,0],zoom:3' 'center:[22.3089,113.9147],zoom:11';
        sub_filter 'function N(){let o=bt();return(0,ge.useEffect)(()=>{o.addLayer(S)' 'function N(){let o=bt();return(0,ge.useEffect)(()=>{window.dispatchEvent(new CustomEvent("ops-tak-map-context",{detail:{map:o,leaflet:ra.default,socket:j}}));o.addLayer(S)';
        sub_filter_once on;
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        try_files $uri =404;
    }

    location ^~ /api/rabbitmq/ { return 404; }

    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Ssl-Cert "";
    }

    location /socket.io {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $golf_tak_connection;
        proxy_read_timeout 75s;
        proxy_buffering off;
    }

    location ^~ /Marti { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
