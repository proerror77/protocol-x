include /opt/golf-tak-admin/assets.conf;

location = /index.html {
    sub_filter '</head>' '<link rel="stylesheet" href="/golf-tak-admin/admin.css"><link rel="stylesheet" href="/golf-tak-admin/aircraft.css?v=weather-1"><script defer src="/golf-tak-admin/admin.js"></script><script defer src="/golf-tak-admin/weather.js"></script><link rel="stylesheet" href="/golf-tak-admin/map-workbench.css"><script defer src="/golf-tak-admin/map-workbench.js"></script><script defer src="/golf-tak-admin/aircraft.js?v=weather-1"></script></head>';
    sub_filter_once on;
    add_header Cache-Control "no-cache";
}

location ~ ^/assets/js/Map-[A-Za-z0-9_-]+\.js$ {
    try_files $uri =404;
    sub_filter_types application/javascript text/javascript;
    sub_filter 'function N(){let o=bt();return(0,ge.useEffect)(()=>{o.addLayer(S)' 'function N(){let o=bt();return(0,ge.useEffect)(()=>{window.dispatchEvent(new CustomEvent("ops-tak-map-context",{detail:{map:o,leaflet:ra.default,socket:j}}));o.addLayer(S)';
    sub_filter_once on;
    add_header Cache-Control "no-cache";
}
