location = /golf-tak-admin/admin.js {
    alias /opt/golf-tak-admin/admin.js;
    add_header Cache-Control "no-cache";
}

location = /golf-tak-admin/admin.css {
    alias /opt/golf-tak-admin/admin.css;
    add_header Cache-Control "no-cache";
}

location = /golf-tak-admin/aircraft.js {
    alias /opt/golf-tak-admin/aircraft.js;
    add_header Cache-Control "no-cache";
}

location = /golf-tak-admin/_flight-session {
    internal;
    proxy_pass http://127.0.0.1:8081/api/me;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Accept application/json;
}

location = /golf-tak-admin/flight-arrivals {
    auth_request /golf-tak-admin/_flight-session;
    limit_except GET { deny all; }
    add_header Cache-Control "no-store" always;
    proxy_pass http://127.0.0.1:8000/internal/hkg-map-arrivals;
    proxy_pass_request_headers off;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
}

location = /golf-tak-admin/aircraft.css {
    alias /opt/golf-tak-admin/aircraft.css;
    add_header Cache-Control "no-cache";
}

location = /golf-tak-admin/weather.js {
    alias /opt/golf-tak-admin/weather.js;
    add_header Cache-Control "no-cache";
}

location = /golf-tak-admin/weather/wind {
    include /opt/golf-tak-admin/weather-proxy.conf;
    proxy_pass https://data.weather.gov.hk/weatherAPI/hko_data/regional-weather/latest_10min_wind.csv;
}

location = /golf-tak-admin/weather/visibility {
    include /opt/golf-tak-admin/weather-proxy.conf;
    proxy_pass https://data.weather.gov.hk/weatherAPI/hko_data/regional-weather/latest_10min_visibility.csv;
}
