name: golf-ops-starter
services:
  ops:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      OPS_DB_PATH: /opt/golf-ops/data/ops.db
    volumes:
      - ops-data:/opt/golf-ops/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
volumes:
  ops-data:
